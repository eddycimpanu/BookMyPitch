# Starts the whole project with one command: docker compose up
# Reads DB_NAME, DB_USER and DB_PASSWORD from your .env file.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # The database files live in a Docker volume, so the data survives a restart
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      # Inside Docker the database is the "db" service, not localhost
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      # Your code folder is shared with the container, so edits show up without rebuilding
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once the site answers, which is after the migrations ran
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 3s
      timeout: 5s
      retries: 20

  reminders:
    build: .
    command: python manage.py send_match_reminders --every 300
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
