{% extends "base.html" %}

{% block title %}Log in | BookMyPitch{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-success btn-lg w-100">Log in</button>
    </form>

    <p class="auth-switch">New to BookMyPitch? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
