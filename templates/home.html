{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}

{% block content %}
<header class="finder-header">
  <h1>Matches in Bucharest</h1>
  <p class="finder-summary" id="match-summary">Loading matches...</p>
</header>

<div class="finder">
  <div class="finder__map pitch-frame">
    <div id="map" data-api-url="{% url 'pitches_api' %}" role="region" aria-label="Map of pitches with upcoming matches"></div>
  </div>

  <section class="finder__list" aria-label="Upcoming matches">
    <div id="match-list" class="match-list"></div>
  </section>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{% static 'js/map.js' %}"></script>
{% endblock %}
